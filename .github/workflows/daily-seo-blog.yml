name: Daily SEO Blog Publishing Engine

on:
  schedule:
    # 03:30 UTC = 09:00 AM Indian Standard Time (IST) every day
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (Validate quality gates without committing/publishing)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force publish next unwritten topic'
        required: false
        type: boolean
        default: false
      topic_slug:
        description: 'Specific topic slug from calendar to publish (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: meetly-daily-blog-main
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run_today: ${{ steps.window.outputs.run_today }}
    steps:
      - uses: actions/checkout@v4
      - name: Check one-month publishing window and daily limit
        id: window
        env:
          MANUAL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || inputs.dry_run) }}
        run: |
          if [ "$MANUAL_OVERRIDE" = "true" ]; then
            echo "run_today=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/daily-blog-engine.js --schedule-check
          fi

  publish-daily-blog:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_today == 'true'
    name: Generate & Publish Daily Blog Post
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate remaining prepared articles
        run: node scripts/daily-blog-engine.js --validate-queue

      - name: Verify publication works without API access
        run: node scripts/check-keyless-publishing.mjs

      - name: Publish the next prepared daily article
        env:
          BLOG_AUTOMATION_PAUSED: ${{ vars.BLOG_AUTOMATION_PAUSED }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_TOPIC_SLUG: ${{ inputs.topic_slug }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run --force)
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ -n "$INPUT_TOPIC_SLUG" ]; then
            ARGS+=("--slug=$INPUT_TOPIC_SLUG")
          fi
          node scripts/daily-blog-engine.js "${ARGS[@]}"

      - name: Preserve rejected drafts and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-editorial-review-${{ github.run_id }}
          path: |
            content/drafts/*.json
            DAILY_BLOG_AUTOMATION_REPORT.md
          if-no-files-found: ignore

      - name: Verify TypeScript Types
        run: pnpm run check

      - name: Verify Unit & Integration Tests
        run: pnpm run test

      - name: Build & Prerender Static HTML
        run: pnpm run build

      - name: Check crawlable pages, metadata and sitemap
        run: node scripts/check-seo.js

      - name: Commit & Push Daily Article
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Meetly Blog Automation Bot"
          git config user.email "bot@meet-ly.in"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add content/blog/ client/public/sitemap.xml DAILY_BLOG_AUTOMATION_REPORT.md
            LATEST_TITLE=$(node -e "try { const a = JSON.parse(require('fs').readFileSync('content/blog/articles.json','utf-8')); console.log(a[a.length-1].title); } catch { console.log('New Article'); }")
            git commit -m "chore(blog): daily auto-publish '$LATEST_TITLE'"
            git push origin main
            echo "Successfully committed and pushed new article to main. Verify the connected hosting deployment separately."
          else
            echo "No new articles published or no changes detected."
          fi

