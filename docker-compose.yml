version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evolix/meetly:latest
    container_name: meetly_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://meetly_user:${DB_PASSWORD:-secure_meetly_db_pass_2026}@db:3306/meetly
      - SESSION_SECRET=${SESSION_SECRET:-change_in_production_to_a_long_random_hex_string}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MODERATOR_KEY=${MODERATOR_KEY:-change_in_production_to_a_secure_moderator_secret}
      - STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      # Production TURN Relay Configuration (Coturn)
      - TURN_SERVERS=${TURN_SERVERS:-turn:meetly-coturn:3478?transport=udp,turn:meetly-coturn:3478?transport=tcp}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-change_in_production_to_a_strong_turn_secret}
      - TURN_REALM=${TURN_REALM:-meetly.internal}
      - TURN_CREDENTIAL_TTL=${TURN_CREDENTIAL_TTL:-86400}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - meetly_net

  coturn:
    image: coturn/coturn:latest
    container_name: meetly_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=${TURN_SHARED_SECRET:-change_in_production_to_a_strong_turn_secret}
      - TURN_REALM=${TURN_REALM:-meetly.internal}
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SHARED_SECRET:-change_in_production_to_a_strong_turn_secret}"
      - "--realm=${TURN_REALM:-meetly.internal}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - meetly_net

  db:
    image: mysql:8.0
    container_name: meetly_db
    restart: unless-stopped
    # Do NOT expose port 3306 to host for security; accessible only via internal bridge network
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-super_secure_root_password_2026}
      MYSQL_DATABASE: meetly
      MYSQL_USER: meetly_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_meetly_db_pass_2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "meetly_user", "-p${DB_PASSWORD:-secure_meetly_db_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - meetly_net

volumes:
  db_data:
    driver: local

networks:
  meetly_net:
    driver: bridge
