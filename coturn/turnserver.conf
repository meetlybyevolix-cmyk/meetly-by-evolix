# ==============================================================================
# Coturn TURN/STUN Server Configuration for Meetly (Evolix Studio)
# Production-ready configuration for NAT traversal and WebRTC relay
# ==============================================================================

# Listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Listening and relay IP bindings
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Dynamic relay port range (UDP)
min-port=49152
max-port=49200

# Realm and authentication mechanism
realm=meetly.internal
use-auth-secret
static-auth-secret=replace_with_turn_shared_secret_in_production

# Nonce expiration (seconds)
stale-nonce=600

# Security, isolation and abuse controls
no-multicast-peers
no-loopback-peers
no-cli
total-quota=150
user-quota=10
max-allocate-per-user=8

# Fingerprint in STUN/TURN messages
fingerprint

# Verbose logging (disable in high-throughput production)
verbose
log-file=stdout
