<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>Meetly – Make New Friends Online | Text &amp; Video Chat</title>
    <meta
      name="description"
      content="Meet new people through random text and video conversations on Meetly. Connect with adults worldwide, explore shared interests, and start chatting."
    />
    <meta name="theme-color" content="#f8f7f1" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://meet-ly.in/" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/meetly-mark.svg" />
    <link rel="apple-touch-icon" href="/meetly-mark.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meetly" />
    <meta property="og:url" content="https://meet-ly.in/" />
    <meta property="og:title" content="Meetly – Make New Friends Online | Text &amp; Video Chat" />
    <meta property="og:description" content="Meet new people through random text and video conversations on Meetly. Connect with adults worldwide, explore shared interests, and start chatting." />
    <meta property="og:image" content="https://meet-ly.in/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Meetly — Make New Friends Online through Text and Video Chat" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://meet-ly.in/" />
    <meta name="twitter:title" content="Meetly – Make New Friends Online | Text &amp; Video Chat" />
    <meta name="twitter:description" content="Meet new people through random text and video conversations on Meetly. Connect with adults worldwide, explore shared interests, and start chatting." />
    <meta name="twitter:image" content="https://meet-ly.in/og-image.svg" />
    <meta name="twitter:image:alt" content="Meetly — Make New Friends Online through Text and Video Chat" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://meet-ly.in/#website",
          "url": "https://meet-ly.in/",
          "name": "Meetly",
          "description": "Adults-only random text and video chat platform for meeting new people and making online friendships.",
          "publisher": {
            "@type": "Organization",
            "@id": "https://meet-ly.in/#organization",
            "name": "Evolix Studio",
            "url": "https://meet-ly.in/"
          },
          "inLanguage": "en-US"
        },
        {
          "@type": "WebApplication",
          "@id": "https://meet-ly.in/#application",
          "name": "Meetly",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript and WebRTC enabled browser",
          "url": "https://meet-ly.in/",
          "description": "Meet new people and make friends online with anonymous random text and opt-in peer-to-peer video conversations.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
