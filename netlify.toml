# ==============================================================================
# Meetly — Netlify Deployment Configuration
# Product: Meetly (Anonymous Random Video & Text Chat)
# Maintained by: Evolix Studio
# ==============================================================================

[build]
  # Builds only the client static assets with Vite into dist/public
  command = "pnpm run build:static"
  publish = "dist/public"

[build.environment]
  # Node.js runtime and package manager versions
  NODE_VERSION = "22"
  PNPM_VERSION = "10.18.0"

# ------------------------------------------------------------------------------
# API & Backend Reverse Proxy (Optional)
# If your Express backend runs on Render, Railway, or VPS, uncomment and update:
# ------------------------------------------------------------------------------
# [[redirects]]
#   from = "/api/*"
#   to = "https://meetly-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# ------------------------------------------------------------------------------
# Public routes are prerendered by build:static. Missing routes use 404.html.
# Keep legacy links pointing at their canonical pages.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/guidelines"
  to = "/community-guidelines"
  status = 301

[[redirects]]
  from = "/report-abuse"
  to = "/grievance"
  status = 301

# ------------------------------------------------------------------------------
# Security & Privacy Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow camera and microphone for WebRTC on Meetly origin
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ------------------------------------------------------------------------------
# Caching Policy for Immutable Build Assets
# ------------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

